<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="bodyGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="roofGradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Car Shadow on Road -->
  <ellipse cx="80" cy="72" rx="70" ry="6" fill="#000000" opacity="0.3" />

  <!-- Main Body Group with Shadow -->
  <g filter="url(#carShadow)">
    <!-- Rear Wing / Spoiler -->
    <path d="M 12 28 L 26 28 L 22 38 L 10 38 Z" fill="#047857" />
    <path d="M 6 26 L 28 26 L 26 30 L 4 30 Z" fill="#34D399" stroke="#047857" stroke-width="1.5" />

    <!-- Exhaust Pipe -->
    <rect x="6" y="52" width="10" height="6" rx="2" fill="#64748B" stroke="#334155" stroke-width="1" />
    <ellipse cx="6" cy="55" rx="2" ry="2.5" fill="#1E293B" />

    <!-- Aerodynamic Cabin / Roof -->
    <path d="M 46 36 L 68 20 L 104 20 L 118 36 Z" fill="url(#roofGradGreen)" stroke="#047857" stroke-width="2" />
    
    <!-- Cockpit Windshield & Windows -->
    <path d="M 50 35 L 69 23 L 88 23 L 88 35 Z" fill="url(#glassGrad)" opacity="0.9" />
    <path d="M 92 23 L 102 23 L 114 35 L 92 35 Z" fill="url(#glassGrad)" opacity="0.9" />
    <!-- Window Gloss Highlight -->
    <path d="M 54 33 L 68 25 L 74 25 L 60 33 Z" fill="#FFFFFF" opacity="0.6" />

    <!-- Lower Chassis & Streamlined Body -->
    <path d="M 10 54 
             C 10 44, 18 38, 30 38
             L 48 38
             L 68 20
             L 106 20
             L 122 36
             L 142 42
             C 152 46, 156 52, 154 58
             L 148 62
             L 12 62
             Z" 
          fill="url(#bodyGradGreen)" 
          stroke="#047857" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Racing Stripe (White & Gold) -->
    <path d="M 24 48 L 148 48 L 147 52 L 24 52 Z" fill="#FEF08A" />
    <path d="M 24 52 L 146 52 L 145 54 L 24 54 Z" fill="#FFFFFF" />

    <!-- Headlight (Front Facing Right) -->
    <path d="M 142 45 C 148 46, 152 49, 152 52 L 140 52 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="1" />
    <polygon points="144,48 150,50 144,51" fill="#FFFFFF" opacity="0.8" />

    <!-- Racing Number Decal Badge (#1) -->
    <circle cx="78" cy="46" r="11" fill="#FFFFFF" stroke="#047857" stroke-width="2" />
    <text x="78" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#047857" text-anchor="middle">1</text>

    <!-- Taillight (Rear Facing Left) -->
    <rect x="10" y="44" width="4" height="8" rx="1.5" fill="#EF4444" />
  </g>

  <!-- Left Wheel (Rear) -->
  <g>
    <!-- Tire -->
    <circle cx="36" cy="60" r="15" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <!-- Rim -->
    <circle cx="36" cy="60" r="9" fill="url(#wheelGrad)" stroke="#64748B" stroke-width="1.5" />
    <!-- Hubcap Nut -->
    <circle cx="36" cy="60" r="3" fill="#10B981" />
    <!-- Tread Spokes -->
    <line x1="36" y1="52" x2="36" y2="68" stroke="#475569" stroke-width="1.5" />
    <line x1="28" y1="60" x2="44" y2="60" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Right Wheel (Front) -->
  <g>
    <!-- Tire -->
    <circle cx="126" cy="60" r="15" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <!-- Rim -->
    <circle cx="126" cy="60" r="9" fill="url(#wheelGrad)" stroke="#64748B" stroke-width="1.5" />
    <!-- Hubcap Nut -->
    <circle cx="126" cy="60" r="3" fill="#10B981" />
    <!-- Tread Spokes -->
    <line x1="126" y1="52" x2="126" y2="68" stroke="#475569" stroke-width="1.5" />
    <line x1="118" y1="60" x2="134" y2="60" stroke="#475569" stroke-width="1.5" />
  </g>
</svg>
