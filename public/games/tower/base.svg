  <path d="M68 48V68 M80 48V68 M92 48V68 M104 48V68 M116 48V68 M128 48V68 M212 48V68 M224 48V68 M236 48V68 M248 48V68 M260 48V68 M272 48V68" stroke="#FFFFFF" stroke-width="2.5"/>

