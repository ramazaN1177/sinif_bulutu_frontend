  <g transform="translate(240, 88)">
    <path d="M0 12C0 5.373 5.373 0 12 0C18.627 0 24 5.373 24 12V42H0V12Z" fill="#FFF7ED"/>
    <path d="M3.5 13C3.5 7.5 7.5 3.5 12 3.5C16.5 3.5 20.5 7.5 20.5 13V39H3.5V13Z" fill="#2BA4DB"/>
