<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 86" fill="none">
  <!-- Main Terracotta Brick Wall Body -->
  <rect x="3" y="8" width="124" height="74" rx="2" fill="#E25135"/>
  
  <!-- Brick Texture Grout Lines -->
  <path d="M3 21H127 M3 35H127 M3 49H127 M3 63H127 M3 77H127" stroke="#C33B22" stroke-width="1.2" stroke-dasharray="14 14"/>
  <path d="M3 28H127 M3 42H127 M3 56H127 M3 70H127" stroke="#C33B22" stroke-width="1.2" stroke-dasharray="7 14 7"/>

  <!-- Top Roof Cornice / White Ledge -->
  <rect x="0" y="3" width="130" height="7" rx="2" fill="#FFFDF8"/>
  <rect x="0" y="0" width="130" height="3" rx="1.5" fill="#FFFFFF"/>
  <line x1="2" y1="10" x2="128" y2="10" stroke="#D3C7BC" stroke-width="1"/>

  <!-- Bottom Baseline -->
  <rect x="3" y="81" width="124" height="4" fill="#B9331C"/>

  <!-- Left Arched Window -->
  <g transform="translate(19, 18)">
    <!-- White Exterior Arch Frame -->
    <path d="M0 16V40H30V16C30 7.163 23.284 0 15 0C6.716 0 0 7.163 0 16Z" fill="#FFF8F0"/>
    <!-- Dark Inner Reveal -->
    <path d="M3.5 17V38H26.5V17C26.5 9.5 21.35 3.5 15 3.5C8.65 3.5 3.5 9.5 3.5 17Z" fill="#1E293B"/>
    <!-- Blue Window Glass -->
    <path d="M4.5 18V37H25.5V18C25.5 10.5 20.8 5 15 5C9.2 5 4.5 10.5 4.5 18Z" fill="#2BA4DB"/>
    <!-- Glossy Glass Reflection Glare Streaks -->
    <path d="M8 17L18 6" stroke="#90E0FD" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M7 28L21 12" stroke="#90E0FD" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Bottom Window Sill -->
    <rect x="-2" y="38" width="34" height="3.5" rx="1" fill="#F1ECE5"/>
  </g>

  <!-- Right Arched Window -->
  <g transform="translate(81, 18)">
    <!-- White Exterior Arch Frame -->
    <path d="M0 16V40H30V16C30 7.163 23.284 0 15 0C6.716 0 0 7.163 0 16Z" fill="#FFF8F0"/>
    <!-- Dark Inner Reveal -->
    <path d="M3.5 17V38H26.5V17C26.5 9.5 21.35 3.5 15 3.5C8.65 3.5 3.5 9.5 3.5 17Z" fill="#1E293B"/>
    <!-- Blue Window Glass -->
    <path d="M4.5 18V37H25.5V18C25.5 10.5 20.8 5 15 5C9.2 5 4.5 10.5 4.5 18Z" fill="#2BA4DB"/>
    <!-- Glossy Glass Reflection Glare Streaks -->
    <path d="M8 17L18 6" stroke="#90E0FD" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M7 28L21 12" stroke="#90E0FD" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Bottom Window Sill -->
    <rect x="-2" y="38" width="34" height="3.5" rx="1" fill="#F1ECE5"/>
  </g>
</svg>
