<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" fill="none">
  <!-- Hanging Ropes from Hook -->
  <line x1="130" y1="0" x2="45" y2="35" stroke="#523219" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="0" x2="215" y2="35" stroke="#523219" stroke-width="3" stroke-linecap="round"/>

  <!-- Wooden Plank Board Body -->
  <g transform="translate(10, 25)">
    <!-- Drop Shadow -->
    <rect x="0" y="8" width="240" height="95" rx="8" fill="#000000" fill-opacity="0.25"/>

    <!-- Wood Plank Background Layers -->
    <rect x="0" y="0" width="240" height="95" rx="8" fill="#9C6436" stroke="#4C2812" stroke-width="4"/>
    
    <!-- Wood Planks Horizontal Seams -->
    <line x1="4" y1="32" x2="236" y2="32" stroke="#68391A" stroke-width="2.5"/>
    <line x1="4" y1="64" x2="236" y2="64" stroke="#68391A" stroke-width="2.5"/>

    <!-- Corner Metal Nails -->
    <circle cx="12" cy="12" r="3.5" fill="#261A12"/>
    <circle cx="228" cy="12" r="3.5" fill="#261A12"/>
    <circle cx="12" cy="83" r="3.5" fill="#261A12"/>
    <circle cx="228" cy="83" r="3.5" fill="#261A12"/>

    <!-- 3D Cartoon Text: KULE YAPMA -->
    <text x="120" y="44" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="#3E1E0B" letter-spacing="1.5">
      KULE
    </text>
    <text x="120" y="42" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="#FFDF00" stroke="#4C2812" stroke-width="2" letter-spacing="1.5">
      KULE
    </text>

    <text x="120" y="78" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="32" fill="#3E1E0B" letter-spacing="1">
      YAPMA
    </text>
    <text x="120" y="76" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="32" fill="#FFDF00" stroke="#4C2812" stroke-width="2" letter-spacing="1">
      YAPMA
    </text>
  </g>
</svg>
